name: 'Setup Neom Flutter & Private Modules'
description: 'Configures GitHub PAT for multi-org private modules, removes local pubspec_overrides.yaml, sets up Flutter SDK with cache, and runs flutter pub get.'

inputs:
  flutter_channel:
    description: 'Flutter channel to install'
    required: false
    default: 'stable'
  flutter_version:
    description: 'Optional exact Flutter SDK version to pin (empty = latest on channel)'
    required: false
    default: ''
  gh_modules_pat:
    description: 'GitHub PAT with read access to Open-Neom, Cyberneom, and emmanuel-montoya private modules'
    required: false
    default: ''
  working_directory:
    description: 'Working directory of the Flutter project'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Configure Git HTTPS rewrite for multi-org Neom modules
      shell: bash
      env:
        GH_PAT: ${{ inputs.gh_modules_pat }}
      run: |
        # Strip accidental CR/LF or surrounding whitespace without ever printing the secret
        CLEAN_PAT="$(printf '%s' "$GH_PAT" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
        if [ -n "$CLEAN_PAT" ]; then
          case "$CLEAN_PAT" in
            ghp_*|github_pat_*|gho_*|ghs_*|ghu_*)
              ;;
            *)
              echo "::error::GH_MODULES_PAT does not start with a valid GitHub token prefix (ghp_ / github_pat_). Re-upload it cleanly with: read -rs PAT && printf '%s' \"\$PAT\" | gh secret set GH_MODULES_PAT --repo ..."
              exit 1
              ;;
          esac
          # Use --add so subsequent insteadOf entries do NOT overwrite git@github.com:
          git config --global --unset-all "url.https://x-access-token:${CLEAN_PAT}@github.com/.insteadOf" 2>/dev/null || true
          git config --global --add "url.https://x-access-token:${CLEAN_PAT}@github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://x-access-token:${CLEAN_PAT}@github.com/.insteadOf" "ssh://git@github.com/"
          git config --global --add "url.https://x-access-token:${CLEAN_PAT}@github.com/Open-Neom/.insteadOf" "https://github.com/Open-Neom/"
          git config --global --add "url.https://x-access-token:${CLEAN_PAT}@github.com/Cyberneom/.insteadOf" "https://github.com/Cyberneom/"
          git config --global --add "url.https://x-access-token:${CLEAN_PAT}@github.com/emmanuel-montoya/.insteadOf" "https://github.com/emmanuel-montoya/"
          echo "Configured GitHub token rewrite for SSH & HTTPS Neom module URLs."
          if ! GIT_TERMINAL_PROMPT=0 git ls-remote git@github.com:Open-Neom/neom_core.git HEAD >/dev/null 2>&1; then
            echo "::error::GH_MODULES_PAT failed private module access check against Open-Neom/neom_core. Verify the token has 'repo' scope (or Contents: Read on Open-Neom, Cyberneom, and emmanuel-montoya) and SSO authorization if required."
            exit 1
          fi
          echo "Verified private module access via GH_MODULES_PAT."
        else
          echo "::warning::GH_MODULES_PAT secret is empty. Only public GitHub modules will be accessible."
        fi

    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ inputs.flutter_channel }}
        flutter-version: ${{ inputs.flutter_version }}
        cache: true

    - name: Unify CI Git Dependency Overrides & Run flutter pub get
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        # Remove developer-machine pubspec_overrides.yaml before generating CI overrides.
        # Run dart from .cicd_tools (which has no pubspec.yaml) so dart does not trigger
        # a premature pub get against the app directory before overrides are written.
        rm -f pubspec_overrides.yaml
        APP_DIR="$(pwd)"
        (cd "${{ github.action_path }}/../../.." && dart run scripts/generate_ci_overrides.dart "$APP_DIR")
        flutter --version
        flutter pub get
